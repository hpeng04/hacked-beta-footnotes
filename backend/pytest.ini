[pytest]
testpaths = tests
# Live tests call real LLMs and are skipped by default. Run them with:
#   python -m pytest -m live      (cloud providers from backend/.env)
#   python -m pytest -m ollama    (local Ollama server)
addopts = -m "not live and not ollama"
markers =
    live: calls the primary/backup LLM providers configured in backend/.env
    ollama: calls a local Ollama server (http://localhost:11434)
