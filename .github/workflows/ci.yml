name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # The transcription and integration tests run real ffmpeg; without it they are skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Errors only (syntax, undefined names, unused imports), not style.
      - run: ruff check --isolated --select E9,F .
      # Live LLM tests are skipped by pytest.ini.
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
